{% extends 'base.html' %}{% block content %}<h1>Add a lead</h1><p>New leads are scored and can automatically enter the follow-up queue.</p><form method="post" class="panel form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label><label>Company<input name="company"></label><label>Source<select name="source">{% for s in sources %}<option>{{s}}</option>{% endfor %}</select></label><label>Estimated value ($)<input name="value" type="number" step="0.01"></label><label class="wide">Notes<textarea name="notes" rows="4" placeholder="What did they ask for? What service or product are they interested in?"></textarea></label><label class="check"><input type="checkbox" name="consent_email" checked> Email follow-up permitted</label><label class="check"><input type="checkbox" name="consent_sms"> SMS follow-up permitted</label><button class="btn">Start rescue workflow</button></form>{% endblock %}
