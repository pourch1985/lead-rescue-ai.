{% extends 'base.html' %}{% block content %}<h1>Settings</h1><form method="post" class="panel form"><label>Business name<input name="business_name" value="{{settings.business_name}}"></label><label>Follow-up delay (hours)<input name="followup_delay_hours" type="number" min="1" value="{{settings.followup_delay_hours}}"></label><label>Sender name<input name="sender_name" value="{{settings.sender_name}}"></label><label>Sender email<input name="sender_email" type="email" value="{{settings.sender_email}}"></label><label class="wide">Brand voice<textarea name="brand_voice">{{settings.brand_voice}}</textarea></label><label class="wide">Booking link<input name="booking_link" value="{{settings.booking_link}}" placeholder="https://calendly.com/..."></label><label>OpenAI model<input name="openai_model" value="{{settings.openai_model}}"></label><label>Timezone<input name="timezone" value="{{settings.timezone or 'America/New_York'}}"></label><label>Appointment duration (minutes)<input name="appointment_duration_minutes" type="number" min="10" step="5" value="{{settings.appointment_duration_minutes or 30}}"></label><label>Industry<input name="industry" value="{{settings.industry}}"></label><label class="wide">Business goal<input name="business_goal" value="{{settings.business_goal}}"></label><label class="check"><input type="checkbox" name="auto_followup_enabled" value="1" {% if settings.auto_followup_enabled=='1' %}checked{% endif %}> Enable automatic follow-up scheduling</label><button class="btn">Save settings</button></form><section class="panel narrow"><h2>Workspace security</h2><p>Your lead data is separated by business account, and the inbound webhook requires a unique workspace key.</p></section>{% endblock %}
