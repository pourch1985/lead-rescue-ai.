{% extends 'base.html' %}{% block content %}<div class="setup-wrap"><div class="eyebrow">Workspace setup</div><h1>Turn missed leads into booked business</h1><p>Give the recovery engine enough context to sound like your business and send leads to the right next step.</p><form method="post" class="panel form setup-form"><label>Business name<input name="business_name" required value="{{settings.business_name}}"></label><label>Industry<input name="industry" placeholder="Cleaning, HVAC, legal, med spa..." value="{{settings.industry}}"></label><label class="wide">Primary goal<select name="business_goal"><option>Book more qualified appointments</option><option>Recover abandoned inquiries</option><option>Increase quote follow-up</option><option>Reactivate old leads</option></select></label><label class="wide">Brand voice<textarea name="brand_voice" rows="3">{{settings.brand_voice}}</textarea></label><label class="wide">Booking link<input name="booking_link" value="{{settings.booking_link}}" placeholder="https://calendly.com/your-business"></label><label>Timezone<input name="timezone" value="{{settings.timezone or 'America/New_York'}}"></label><label>Sender name<input name="sender_name" value="{{settings.sender_name}}"></label><label class="wide">Sender email<input type="email" name="sender_email" value="{{settings.sender_email}}" placeholder="hello@yourdomain.com"></label><button class="btn wide">Finish setup</button></form></div>{% endblock %}
